<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="https://www.google.com/s2/favicons?sz=64&domain=blinkit.com">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blinkit Thermal Print Labels (6x4)</title>
  
  <!-- Toastify.js CSS -->
  <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary-blue: #2563eb;
      --dark-blue: #1d4ed8;
      --success-green: #059669;
      --dark-green: #047857;
      --error-red: #dc2626;
      --text-dark: #1f2937;
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #f9fafb;
      color: var(--text-dark);
      padding: 1rem;
    }

    .app-header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .app-header h1 {
      color: var(--primary-blue);
      font-size: 2rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .app-header p {
      font-size: 1rem;
      font-weight: 600;
      color: #4b5563;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .input-panel {
      background: white;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: var(--shadow-lg);
      margin-bottom: 2rem;
      border: 1px solid #e5e7eb;
    }

    .form-grid {
      display: grid;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-dark);
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 0.875rem;
      border: 2px solid #e5e7eb;
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      transition: all 0.2s ease;
      background: #ffffff;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 200px;
      font-family: 'Courier New', monospace;
      font-weight: 600;
    }

    .button-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }

    button {
      flex: 1;
      min-width: 150px;
      padding: 0.875rem 1.5rem;
      font-size: 1rem;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }

    .btn-primary {
      background: var(--primary-blue);
      color: white;
    }

    .btn-primary:hover {
      background: var(--dark-blue);
      transform: translateY(-1px);
    }

    .btn-success {
      background: var(--success-green);
      color: white;
    }

    .btn-success:hover {
      background: var(--dark-green);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .info-box {
      background: #eff6ff;
      border-left: 4px solid var(--primary-blue);
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 500;
    }

    /* === THERMAL LABEL STYLES (6x4 inches) === */
    #thermalArea {
      margin-top: 2rem;
      display: block;
      width: 100%;
    }

    .thermal-label {
      width: 152.4mm;
      height: 101.6mm;
      background: white;
      border: 2px solid #000;
      margin: 0 auto 1.5rem auto;
      padding: 8mm;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: var(--shadow-lg);
      page-break-inside: avoid;
      page-break-after: always;
      overflow: hidden;
    }

    .txt-name {
      font-size: 22pt;
      font-weight: 900;
      text-transform: uppercase;
      margin: 0 0 5px 0;
      line-height: 1.1;
      color: var(--text-dark);
      letter-spacing: 0.5px;
    }

    .txt-comp {
      font-size: 16pt;
      font-weight: 800;
      margin: 0 0 5px 0;
      color: var(--text-dark);
    }

    .txt-ware {
      font-size: 15pt;
      font-weight: 900;
      margin: 0 0 10px 0;
      color: #000;
      letter-spacing: 0.3px;
    }

    .barcode-svg {
      width: 80%;
      height: 65px;
      margin: 5px 0;
      display: block;
    }

    .txt-meta {
      font-size: 18pt;
      font-weight: 700;
      margin: 2px 0;
      color: var(--text-dark);
    }

    .label-count {
      text-align: center;
      margin-top: 1rem;
      padding: 1rem;
      background: #eff6ff;
      border-radius: 8px;
      font-weight: 600;
      color: var(--primary-blue);
    }

    /* Print Styles */
    @media print {
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
      }

      @page {
        size: 152.4mm 101.6mm;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0 !important;
        padding: 0 !important;
        background: white !important;
        width: 100%;
        height: 100%;
        display: block !important;
      }

      .container {
        margin: 0 !important;
        padding: 0 !important;
        max-width: 100% !important;
        width: 100%;
        display: block !important;
      }

      .app-header,
      .input-panel,
      .label-count,
      button {
        display: none !important;
      }

      #thermalArea {
        margin: 0 !important;
        padding: 0 !important;
        display: block !important;
        width: 100%;
      }

      .thermal-label {
        margin: 0 !important;
        padding: 8mm !important;
        box-shadow: none !important;
        border: 2px solid #000 !important;
        width: 152.4mm !important;
        height: 101.6mm !important;
        background: white !important;
        page-break-inside: avoid !important;
        page-break-after: always !important;
        break-inside: avoid !important;
        break-after: page !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: center !important;
        align-items: center !important;
        text-align: center !important;
        overflow: hidden !important;
      }

      .thermal-label:last-child {
        page-break-after: avoid !important;
        break-after: auto !important;
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 0.5rem;
      }

      .input-panel {
        padding: 1.5rem;
      }

      button {
        width: 100%;
        min-width: auto;
      }
    }
  </style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <h1>🔵 Thermal Print Labels (6x4 Inches)</h1>
  <p>Each label prints on a separate 6x4 inch page</p>
</header>

<!-- MAIN CONTAINER -->
<div class="container">

  <!-- INPUT PANEL -->
  <div class="input-panel">
    <div class="info-box">
      <strong>Thermal Printer Setup:</strong> In print settings, set Paper Size to 4x6 (Landscape) or 6x4 (Portrait) with 0 margins.
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label for="line1">Line 1 (Name)</label>
        <input type="text" id="line1" value="Nilu's collection,">
      </div>

      <div class="form-group">
        <label for="line2">Line 2 (Company)</label>
        <input type="text" id="line2" value="BLINK COMMERCE PRIVATE LIMITED">
      </div>

      <div class="form-group">
        <label for="line3">Line 3 (Warehouse - BOLD)</label>
        <input type="text" id="line3" value="Hyderabad H3 - Feeder Warehouse">
      </div>

      <div class="form-group">
        <label for="upcData">UPC Data (UPC,Quantity,MRP)</label>
        <textarea 
          id="upcData" 
          placeholder="Enter UPC data in format: UPC,Quantity,MRP&#10;&#10;Example:&#10;20110519,31,999&#10;20110520,15,599&#10;20110521,6,1299&#10;20110522,10,459"
          rows="8"></textarea>
      </div>
    </div>

    <div class="button-group">
      <button class="btn-primary" onclick="generateThermalLabels()">🎯 Generate Labels</button>
      <button class="btn-success" onclick="window.print()">🖨️ Print Thermal Labels</button>
    </div>
  </div>

  <!-- THERMAL PRINT AREA -->
  <div id="thermalArea"></div>

</div>

<!-- JS LIBRARIES -->
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

<script>
  function generateThermalLabels() {
    const line1 = document.getElementById('line1').value;
    const line2 = document.getElementById('line2').value;
    const line3 = document.getElementById('line3').value;
    const rawData = document.getElementById('upcData').value.trim();

    if (!rawData) {
      Toastify({
        text: "⚠️ Please enter UPC data!",
        duration: 3000,
        close: true,
        gravity: "top",
        position: "center",
        backgroundColor: "#dc2626",
        stopOnFocus: true
      }).showToast();
      return;
    }

    const items = rawData.split('\n')
      .filter(l => l.trim())
      .map(l => {
        const [u, q, m] = l.split(',');
        return { upc: u?.trim(), qty: q?.trim() || '1', mrp: m?.trim() || '' };
      })
      .filter(i => i.upc);

    const thermalArea = document.getElementById('thermalArea');
    thermalArea.innerHTML = '';

    // Create each label as separate 6x4 inch page
    items.forEach((item, idx) => {
      const bcId = `thermal-${idx}`;
      const labelDiv = document.createElement('div');
      labelDiv.className = 'thermal-label';
      
      labelDiv.innerHTML = `
        <div class="txt-name">${line1}</div>
        <div class="txt-comp">${line2}</div>
        <div class="txt-ware">${line3}</div>
        <svg id="${bcId}" class="barcode-svg"></svg>
        <div class="txt-meta">UPC - ${item.upc}</div>
        <div class="txt-meta">Quantity - ${item.qty} | MRP - ${item.mrp}</div>
      `;
      
      thermalArea.appendChild(labelDiv);

      // Delay barcode generation to ensure SVG is rendered
      setTimeout(() => {
        JsBarcode(`#${bcId}`, item.upc, {
          format: "CODE128",
          width: 3,
          height: 60,
          displayValue: true,
          fontSize: 18,
          margin: 0
        });
      }, 100 + (idx * 50));
    });

    // Add count display
    const countDiv = document.createElement('div');
    countDiv.className = 'label-count';
    countDiv.innerHTML = `✅ ${items.length} thermal label(s) generated - Ready to print!`;
    thermalArea.appendChild(countDiv);

    Toastify({
      text: `✅ ${items.length} thermal label(s) ready! Press "🖨️ Print Thermal Labels" to print.`,
      duration: 3000,
      close: true,
      gravity: "top",
      position: "center",
      backgroundColor: "#059669",
      stopOnFocus: true
    }).showToast();

    // Scroll to labels
    setTimeout(() => {
      thermalArea.scrollIntoView({ behavior: 'smooth' });
    }, 100);
  }

  // Auto-resize textarea
  document.getElementById('upcData').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.max(200, this.scrollHeight) + 'px';
  });

  // Auto-generate on load
  window.addEventListener('DOMContentLoaded', () => {
    generateThermalLabels();
  });
</script>

</body>
</html>
