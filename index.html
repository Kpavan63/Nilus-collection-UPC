<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nilus Collection</title>
</head>
<body>
    <h1>Nilus Collection UPC Data</h1>
    <textarea id="upcInput" placeholder="Enter UPCs in the format (UPC, Quantity, MRP)\nExample: 123456789012, 20, 299.99"></textarea>
    <button onclick="generateLabels()">Generate Labels</button>
    <div id="labels"> </div>

    <script>
        function generateLabels() {
            const input = document.getElementById('upcInput').value;
            const lines = input.split('\n');
            const labelsDiv = document.getElementById('labels');
            labelsDiv.innerHTML = '';
            for (const line of lines) {
                const [upc, quantity, mrp] = line.split(',');
                const label = `<div>Quantity: ${quantity.trim()} - MRP: $${mrp.trim()} - UPC: ${upc.trim()}</div>`;
                labelsDiv.innerHTML += label;
            }
        }
    </script>
</body>
</html>
